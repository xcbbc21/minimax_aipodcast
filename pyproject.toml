[project]
name = "aipodcast"
version = "0.2.0"
description = "AI 单口播客生成器（CLI + Python API，给 AI Agent 用）"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [
    { name = "GoDaddy" },
]
license = { text = "MIT" }
keywords = ["tts", "podcast", "ai-agent", "minimax", "speech"]
dependencies = [
    "typer>=0.12.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "PyPDF2>=3.0.1",
    "pydub>=0.25.1",
    "lxml>=5.0",
    "Flask>=3.0.0",  # 只为兼容 audio_utils 旧 import
    "rich>=13.0.0",  # CLI 漂亮输出
]

[project.scripts]
aipodcast = "aipodcast.cli:main"

[project.urls]
Homepage = "https://github.com/mm-demo-collection/minimax_aipodcast"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aipodcast"]

[tool.hatch.build.targets.sdist]
include = [
    "aipodcast",
    "README.md",
    "examples",
]
